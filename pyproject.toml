[project]

name = "call_me_maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "huggingface-hub>=0.16.0",
]

[build-system]
requires = ["setuptools>=61.0"]
bulding-backend = "setuptools.build_meta"